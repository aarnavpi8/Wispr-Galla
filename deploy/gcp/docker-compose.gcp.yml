# Production overlay for the GCP VM: Caddy in front of the web container with automatic
# HTTPS (Let's Encrypt). The firewall only opens 80/443, so port 3000 stays private.
#   docker compose -f docker-compose.yml -f deploy/gcp/docker-compose.gcp.yml up -d --build

services:
  db:
    restart: unless-stopped
  api:
    restart: unless-stopped
  web:
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is set by redeploy.sh}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/gcp/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  caddy-data:
  caddy-config:
