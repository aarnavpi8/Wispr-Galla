# Included in the server block and in any location that sets its own add_header
# (nginx drops inherited add_header lines once a location adds one).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Mic (voice entries) and camera (bill scan) only for this site; nothing else.
add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(), payment=()" always;
