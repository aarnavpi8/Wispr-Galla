<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BolKhata</title>
    <style>
      :root { --bg: #faf6ee; --ink: #23243a; --deep: #343a77; --muted: #64637a; --gold: #f3c262; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font-family: system-ui, "Noto Sans", "Noto Sans Devanagari", sans-serif; padding: 24px; }
      .card { max-width: 420px; text-align: center; }
      .logo { width: 72px; height: 72px; margin: 0 auto 16px; display: block; }
      h1 { margin: 0 0 8px; font-size: 26px; }
      p { margin: 0 0 12px; color: var(--muted); line-height: 1.5; }
      code { display: block; margin: 12px 0; padding: 12px; border-radius: 14px; background: #f3eee2; color: var(--ink);
        font-size: 13px; text-align: left; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a62b0"/><stop offset="1" stop-color="#252852"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><path d="M20 12h24a10 10 0 0 1 10 10v16a10 10 0 0 1-10 10H27l-8.6 6.6a1.4 1.4 0 0 1-2.3-1.1V47.2A10 10 0 0 1 10 38V22a10 10 0 0 1 10-10Z" fill="#f3c262"/><path d="M16.6 20.5v19M18.8 20.5v19" stroke="#d2553f" stroke-opacity="0.8" stroke-width="1.1" stroke-linecap="round"/><g stroke="#252852" stroke-width="3.6" stroke-linecap="round" fill="none"><path d="M23.5 27v6"/><path d="M29.5 22.5v15"/><path d="M35.5 25.5v9"/><path d="M40.5 31l3.2 3.2 6.3-8.4" stroke-linejoin="round"/></g></svg>
      <h1>BolKhata</h1>
      <p>This app build has no server address yet.</p>
      <p>Rebuild it pointing at your BolKhata server:</p>
      <code>$env:CAP_SERVER_URL="https://your-bolkhata-domain"<br />npx cap sync android</code>
      <p>Then press Run in Android Studio again.</p>
    </main>
  </body>
</html>
