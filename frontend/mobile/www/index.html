<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Galla</title>
    <style>
      :root { --bg: #faf6ee; --ink: #1d2a22; --forest: #103a29; --muted: #6b7568; --lime: #d7f08a; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font-family: system-ui, "Noto Sans", "Noto Sans Devanagari", sans-serif; padding: 24px; }
      .card { max-width: 420px; text-align: center; }
      .logo { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 20px; display: grid; place-items: center;
        background: var(--forest); color: var(--lime); font-size: 32px; font-weight: 800; }
      h1 { margin: 0 0 8px; font-size: 26px; }
      p { margin: 0 0 12px; color: var(--muted); line-height: 1.5; }
      code { display: block; margin: 12px 0; padding: 12px; border-radius: 14px; background: #f3eee2; color: var(--ink);
        font-size: 13px; text-align: left; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">₹</div>
      <h1>Galla</h1>
      <p>This app build has no server address yet.</p>
      <p>Rebuild it pointing at your Galla server:</p>
      <code>$env:CAP_SERVER_URL="https://your-galla-domain"<br />npx cap sync android</code>
      <p>Then press Run in Android Studio again.</p>
    </main>
  </body>
</html>
