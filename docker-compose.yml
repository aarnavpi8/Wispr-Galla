# One command: docker compose up --build   ->   open http://localhost:3000
# Works without a .env file. Optional keys in .env (see .env.example) are passed through.

services:
  db:
    image: postgres:17-alpine
    environment:
      # Local-only database credentials, not secrets.
      POSTGRES_USER: galla
      POSTGRES_PASSWORD: galla
      POSTGRES_DB: galla
    volumes:
      - galla-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galla -d galla"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://galla:galla@db:5432/galla
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Optional Wispr Flow speech-to-text for the in-app mic.
      WISPR_API_KEY: ${WISPR_API_KEY:-}
      # Optional Google login. Empty = login off, app opens straight to the demo shop.
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  galla-db:
